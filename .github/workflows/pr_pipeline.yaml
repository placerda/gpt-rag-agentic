name: Pull Request Pipeline

on:
  pull_request:
    branches:
      - develop

jobs:
  evaluations:
    runs-on: ubuntu-latest
    environment: dev

    # Pull all four dev-environment variables and your SP secrets
    env:
      AZURE_ENV_NAME:        ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION:        ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP:  ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      APP_CONFIG_ENDPOINT:   ${{ vars.APP_CONFIG_ENDPOINT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug APP_CONFIG_ENDPOINT
        run: |
          echo "APP_CONFIG_ENDPOINT=[$APP_CONFIG_ENDPOINT]" 

      - name: Login to Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run evaluation
        run: |
          chmod +x evaluation/evaluate.sh
          ./evaluation/evaluate.sh

      - name: Upload evaluation results
        uses: actions/upload-artifact@v3
        with:
          name: evaluation-results
          path: evaluation/evaluation-results.json
