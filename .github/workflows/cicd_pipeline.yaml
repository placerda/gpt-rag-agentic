name: CI/CD Dev Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI (from GitHub)
        run: |
          AZD_VERSION="1.12.0"
          wget https://github.com/Azure/azure-dev/releases/download/v${AZD_VERSION}/azd-linux-amd64.tar.gz
          tar -xzf azd-linux-amd64.tar.gz
          sudo mv azd /usr/local/bin/

      - name: Login to Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize & deploy with azd
        run: |
          azd init \
            -e "$AZURE_ENV_NAME" \
            -l "$AZURE_LOCATION" \
            -s "$AZURE_SUBSCRIPTION_ID" \
            --no-prompt

          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP" --no-prompt
          azd env refresh --no-prompt
          azd deploy --no-prompt
