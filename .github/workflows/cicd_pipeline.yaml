name: CI/CD Dev Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    # Pull your four "dev" environment variables
    env:
      AZURE_ENV_NAME:        ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION:        ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP:  ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2
        with:
          # pin if you like, or omit for latest
          version: '1.15.0'

      - name: Login to Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure subscription
        run: |
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Authenticate azd CLI
        run: |
          azd auth login \
            --service-principal \
            --client-id     "$AZURE_CLIENT_ID" \
            --client-secret "$AZURE_CLIENT_SECRET" \
            --tenant-id     "$AZURE_TENANT_ID"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # optional sanity check
      - name: Dump AZD vars
        run: |
          echo "ENV_NAME=[$AZURE_ENV_NAME]"
          echo "LOCATION=[$AZURE_LOCATION]"
          echo "RESOURCE_GROUP=[$AZURE_RESOURCE_GROUP]"
          echo "SUBSCRIPTION_ID=[$AZURE_SUBSCRIPTION_ID]"

      - name: Initialize & deploy with azd
        run: |
          azd init \
            -e "$AZURE_ENV_NAME" \
            -l "$AZURE_LOCATION" \
            -s "$AZURE_SUBSCRIPTION_ID" \
            --no-prompt

          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP" --no-prompt
          azd env refresh --no-prompt
          azd deploy --no-prompt
