name: CI/CD Dev Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    env:
      AZURE_ENV_NAME:        ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION:        ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP:  ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2
        with:
          version: '1.15.0'

      - name: Login to Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure subscription
        run: |
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Authenticate azd CLI (via Azure CLI session)
        run: azd auth login --use-azure-cli

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize & deploy with azd
        run: |
          azd init \
            -e "$AZURE_ENV_NAME" \
            -l "$AZURE_LOCATION" \
            -s "$AZURE_SUBSCRIPTION_ID" \
            --no-prompt

          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP" --no-prompt
          azd env refresh --no-prompt
          azd deploy --no-prompt
